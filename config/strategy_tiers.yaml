# Strategy Tier System (from HFT_Brain)
#
# NOTE (D7c, 2026-10-01): This tier file is currently DOCUMENTATION ONLY.
# The registry reads `global_disable` in strategy_regime_filters.yaml, not
# this file. Moving a strategy to tier_4_shadow here does NOT shadow it.
# To actually disable a strategy, add it to global_disable as well.
#
# A future delivery ("wire TierManager into StrategyRegistry") will make
# this file authoritative. Until then, keep both in sync.
tiers:
  tier_1_high_performers:
    description: "Strong auditor AND system validation - protect and prioritize"
    weight: 1.0
    trade_cap: 40
    review_frequency_days: 30
    strategies:
      - false_breakout
      - volume_cluster
      - trapped_traders
      - liquidity_sweep

  tier_2_supporting:
    description: "Positive auditor - supporting cast"
    weight: 0.7
    trade_cap: 20
    review_frequency_days: 14
    strategies:
      - sd_zones
      - mad_fl
      - poc

  tier_3_probationary:
    description: "Helped in walk-forward but auditor negative - re-evaluate often"
    weight: 0.5
    trade_cap: 12
    review_frequency_days: 7
    strategies: []

  tier_4_shadow:
    description: "Disabled but monitored - promote when profitable"
    weight: 0.0
    trade_cap: 0
    review_frequency_days: 3
    strategies:
      - absorption
      - value_area
      - diamond_cancan
      - cardwell_rsi
      - apex_flow
      - mad_combined
      - fvg
      - engulfing_pinbar
      - naked_poc
      - quasimodo
      - intermarket
      - delta_divergence
      - stacked_imbalance
      - ftr_compression
      - head_shoulders
      - double_top_bottom
      # D7c - demoted on evidence from D6c
      - rbd_dbr         # was tier_2; -$28.60 net, -$209 TMO PnL
      - flag_limits     # -$124.64 net, 25.0% WR
      # D8c - demoted on walk-forward consistency (10 windows, 20k candles)
      - mad_bb          # was tier_3; 40.0% pos, -$124.90
      - rmd_trail       # was tier_3; 40.0% pos, -$332.34
      - three_drive     # was tier_2; 44.4% pos, -$449.26
      - bos_choch       # 40.0% pos, -$711.55
      - adaptive_rsi_ml # 30.0% pos, -$654.00
      - bs_ss_liquidity #  0.0% pos (1 trade), -$62.75
      - ichimoku_rsi    # was tier_2; 0.0% pos (1 trade), -$96.11
      - ai_source_ma    # 0 trades across 4 backtests; no evidence either way
      - volume_cluster  # D8c-2; 42.9% pos, -$30.43
      # D8c - demoted on walk-forward consistency (10 windows, 20k candles)
      - mad_bb          # was tier_3; 40.0% pos, -$124.90
      - rmd_trail       # was tier_3; 40.0% pos, -$332.34
      - three_drive     # was tier_2; 44.4% pos, -$449.26
      - bos_choch       # 40.0% pos, -$711.55
      - adaptive_rsi_ml # 30.0% pos, -$654.00
      - bs_ss_liquidity #  0.0% pos (1 trade), -$62.75
      - ichimoku_rsi    # was tier_2; 0.0% pos (1 trade), -$96.11
      - ai_source_ma    # 0 trades across 4 backtests; no evidence either way
      - volume_cluster  # D8c-2; 42.9% pos, -$30.43

accounts:
  personal:
    enabled_tiers: [tier_1_high_performers, tier_2_supporting, tier_3_probationary]
    disabled_tiers: [tier_4_shadow]

  prop:
    enabled_tiers: [tier_1_high_performers, tier_2_supporting, tier_3_probationary]
    disabled_tiers: [tier_4_shadow]

rules:
  promotion:
    tier_4_to_2: "auditor > 0 AND system improves when enabled"
    tier_4_to_3: "auditor > 0 but system unproven"
    tier_3_to_2: "auditor improves above 0 for 2+ review periods"
    tier_3_to_1: "auditor > 5% AND system strongly positive"
    tier_2_to_1: "consistently top-3 in auditor AND system"

  demotion:
    tier_1_to_2: "auditor drops below +5%"
    tier_2_to_3: "auditor drops below 0"
    tier_2_to_4: "system degrades when enabled"
    tier_3_to_4: "auditor stays negative 2+ periods OR system degrades"
