# Strategy x Regime Filter Configuration (from HFT_Brain)
system:
  disabled_strategy_mode: "shadow"

global_disable:
  - poc
  - intermarket
  - sd_zones
  - engulfing_pinbar
  - diamond_cancan
  - value_area
  - absorption
  - fvg
  - delta_divergence
  - stacked_imbalance
  - mad_combined
  - apex_flow
  - cardwell_rsi
  - ftr_compression
  - mad_fl
  - naked_poc
  - quasimodo
  - ml_rsi
  - ai_trend_flow
  - ml_momentum
  - luxalgo_fvg
  - reversal_123
  - turtle_soup
  # D7c - shadowed on evidence from D6c:
  #   rbd_dbr   : -$28.60 net, -$209.04 across 6 TMO exits (worst TMO contributor)
  #   flag_limits: -$124.64 net, 25.0% WR (worst by WR), all TMO exits were losers
  - rbd_dbr
  - flag_limits
  # D8c - shadowed on walk-forward consistency (10 windows, 20k candles):
  #   rule: shadow if positive_rate < 50% AND total_pnl < 0
  #   mad_bb          40.0% pos, 66 trades, -$124.90
  #   rmd_trail       40.0% pos, 66 trades, -$332.34
  #   three_drive     44.4% pos, 21 trades, -$449.26
  #   bos_choch       40.0% pos, 63 trades, -$711.55
  #   adaptive_rsi_ml 30.0% pos, 59 trades, -$654.00
  #   bs_ss_liquidity  0.0% pos,  1 trade,  -$62.75  (sample too small)
  #   ichimoku_rsi     0.0% pos,  1 trade,  -$96.11  (sample too small)
  - mad_bb
  - rmd_trail
  - three_drive
  - bos_choch
  - adaptive_rsi_ml
  - bs_ss_liquidity
  - ichimoku_rsi
  # D8c - ai_source_ma shadowed: 0 trades across 4 backtests (D6c, D7c,
  # D7b, D8b). Zero evidence of contribution. Revisit if it ever fires.
  - ai_source_ma
  # D8c-2 - volume_cluster shadowed: D8c evidence put it below the
  # pruning rule (positive_rate < 50% AND total_pnl < 0).
  #   42.9% pos, 12 trades, -$30.43
  # Kept in D8c to test the theory it might fire more once freed from
  # VOLATILE-only. It fired 12 times but still lost money. Shadow now.
  - volume_cluster

regime_enable_only:
  quasimodo:
    - VOLATILE
  # D8c - volume_cluster freed from VOLATILE-only.
  # Rationale: it produced only 3 trades across 20k candles (11% VOLATILE
  # share); 100% WR on 3 trades is a small-sample artifact, not edge.
  # Freeing it lets D8c actually test whether volume_cluster has signal.
  # Old (D7c and earlier):
  #   volume_cluster:
  #     - VOLATILE

regime_rules:
  RANGING:
    block: []
  VOLATILE:
    block: []
  TRENDING_UP:
    block:
      - false_breakout
      - trapped_traders
      - liquidity_sweep
      - rbd_dbr
      - quasimodo
  TRENDING_DOWN:
    block:
      - false_breakout
      - trapped_traders
      - liquidity_sweep

regime_confidence_overrides:
  RANGING:
    min_debate_confidence: 0.70
  VOLATILE:
    min_debate_confidence: 0.60
  TRENDING_UP:
    min_debate_confidence: 0.80
  TRENDING_DOWN:
    min_debate_confidence: 0.75

trade_caps:
  trapped_traders: 30
  false_breakout: 30
  liquidity_sweep: 30
  quasimodo: 20
  volume_cluster: 20
